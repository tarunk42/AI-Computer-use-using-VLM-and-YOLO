Section "Device"
    Identifier "dummy0"
    Driver     "dummy"
    VideoRam   256000
EndSection

Section "Monitor"
    Identifier "mon0"
    HorizSync  5.0 - 1000.0
    VertRefresh 5.0 - 200.0
    Modeline "1280x800" 83.46 1280 1344 1480 1680 800 801 804 828
    Option "DPMS"
EndSection

Section "Screen"
    Identifier "scr0"
    Device     "dummy0"
    Monitor    "mon0"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "1280x800"
    EndSubSection
EndSection

Section "ServerLayout"
    Identifier "layout0"
    Screen     "scr0"
EndSection

Section "ServerFlags"
    Option "AutoAddDevices"    "false"
    Option "AutoEnableDevices" "false"
EndSection
