<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guided Computer Use</title>
<style>
:root {
  --bg: #f6f5f1; --panel: #ffffff; --ink: #1f1f1e; --ink2: #5f5e58; --line: #e3e1da;
  --accent: #2a78d6; --ok: #1b8a5a; --warn: #b8560f; --bad: #c0362c; --mark: #eb6834;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #161615; --panel: #1f1f1d; --ink: #ecebe6; --ink2: #a3a199; --line: #34332f;
          --accent: #5a9cf0; --ok: #3fbf86; --warn: #e58c45; --bad: #ef6b5f; --mark: #ff8a4c; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
       font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
header { display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-bottom: 1px solid var(--line); }
header h1 { font-size: 16px; margin: 0; font-weight: 600; white-space: nowrap; }
header { flex-wrap: wrap; }
header > button { white-space: nowrap; }
.pill { font-size: 12px; padding: 2px 9px; border-radius: 99px; background: var(--line); color: var(--ink2); }
.pill.awaiting_user { background: var(--mark); color: #fff; }
.pill.done { background: var(--ok); color: #fff; }
.pill.error, .pill.stopped { background: var(--bad); color: #fff; }
main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; padding: 16px; }
@media (max-width: 1000px) { main { grid-template-columns: 1fr; } }
.screen { position: relative; background: #000; border-radius: 8px; overflow: hidden; align-self: start;
          box-shadow: 0 1px 3px rgba(0,0,0,.15); }
.screen img { display: block; width: 100%; height: auto; cursor: default; }
.screen.picking img { cursor: crosshair; }
.screen.control { outline: 3px solid var(--mark); outline-offset: 2px; }
.screen.control img { cursor: pointer; }
button.on { background: var(--mark); border-color: var(--mark); color: #fff; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { white-space: nowrap; border: 0; border-radius: 0; padding: 6px 10px; font-size: 13px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.sel { background: var(--accent); color: #fff; }
.seg button.sel[data-m="auto"] { background: var(--mark); }
.hold { font-size: 12px; margin-top: 6px; color: var(--warn); }
.countdown { font-size: 12px; margin-top: 6px; color: var(--ok); font-weight: 600; }
.ctlhint { position: absolute; left: 8px; bottom: 8px; background: rgba(0,0,0,.7); color: #fff; font-size: 12px;
           padding: 3px 8px; border-radius: 4px; display: none; pointer-events: none; }
.screen.control .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { white-space: nowrap; border: 0; border-radius: 0; padding: 6px 10px; font-size: 13px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.sel { background: var(--accent); color: #fff; }
.seg button.sel[data-m="auto"] { background: var(--mark); }
.hold { font-size: 12px; margin-top: 6px; color: var(--warn); }
.countdown { font-size: 12px; margin-top: 6px; color: var(--ok); font-weight: 600; }
.ctlhint { display: block; }
.marker { position: absolute; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%;
          border: 3px solid var(--mark); box-shadow: 0 0 0 3px rgba(255,255,255,.85); pointer-events: none; display: none; }
.marker::after { content: ""; position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px;
                 border-radius: 50%; background: var(--mark); }
.marker.corrected { border-color: var(--accent); }
.marker.corrected::after { background: var(--accent); }
aside { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
.card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink2); margin: 0 0 8px; font-weight: 600; }
textarea, input[type=text] { width: 100%; font: inherit; color: var(--ink); background: var(--bg);
       border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
textarea { min-height: 64px; resize: vertical; }
button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
         padding: 7px 12px; border-radius: 6px; cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.danger { color: var(--bad); }
button:disabled { opacity: .45; cursor: default; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
.examples button { font-size: 12px; padding: 4px 8px; }
.prop .act { font-size: 15px; font-weight: 600; }
.prop .why { color: var(--ink2); margin-top: 4px; }
.risk { color: #fff; background: var(--bad); font-size: 11px; padding: 1px 7px; border-radius: 99px; margin-left: 6px; }
.meta { font-size: 12px; color: var(--ink2); margin-top: 6px; font-variant-numeric: tabular-nums; }
.hint { font-size: 12px; color: var(--ink2); }
.log { font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; max-height: 260px; overflow: auto;
       white-space: pre-wrap; color: var(--ink2); }
.result { font-size: 14px; }
label.chk { font-size: 12px; color: var(--ink2); display: flex; gap: 6px; align-items: center; }
</style>
</head>
<body>
<header>
  <h1>Guided Computer Use</h1>
  <span id="status" class="pill">idle</span>
  <span class="hint" id="elapsed"></span>
  <div class="seg" id="modes" style="margin-left:auto" title="Approval mode (applies immediately)">
    <button data-m="manual" title="You approve every step">Approve each</button><button data-m="low" title="Scroll and wait run on their own">Auto scroll</button><button data-m="auto" title="Everything runs on its own except risky steps">Auto</button>
  </div>
  <button id="ctl" title="Your clicks, scrolls and keys go to the desktop">Take control</button>
  <button class="danger" id="hstop" hidden>Stop task (Esc)</button>
</header>
<main>
  <div class="screen" id="screen">
    <img id="img" src="/screen.jpg" alt="Live view of the browser desktop">
    <div class="marker" id="marker"></div>
    <div class="ctlhint" id="ctlhint">You have control: click, scroll, type, paste. ⌘ acts as Ctrl.</div>
  </div>
  <aside>
    <div class="card">
      <h2>Task</h2>
      <textarea id="task" placeholder="e.g. On Wikipedia, find the year the Eiffel Tower was completed."></textarea>
      <input type="text" id="start" placeholder="Start URL (optional)" style="margin-top:8px">
      <div class="row examples" id="examples"></div>
      <div class="row">
        <button class="primary" id="run">Start</button>
        <label class="chk" id="fuwrap" hidden><input type="checkbox" id="followup" checked> follow-up to last task</label>
      </div>
    </div>
    <div class="card prop" id="propcard" hidden>
      <h2>Proposed step <span id="pn"></span></h2>
      <div class="act" id="pact"></div>
      <div class="why" id="pwhy"></div>
      <input type="text" id="ptext" placeholder="Text to type" hidden style="margin-top:8px">
      <input type="text" id="pnote" placeholder="Note to the agent (optional; required to reject)" style="margin-top:8px">
      <div class="row">
        <button class="primary" id="approve">Approve ⏎</button>
        <button id="reject">Reject</button>
        <button class="danger" id="stop">Stop</button>
      </div>
      <div class="hint" style="margin-top:6px">Wrong spot? Click the screen to move the point, then approve.</div>
      <div class="countdown" id="pcount"></div>
      <div class="hold" id="phold"></div>
      <div class="meta" id="pmeta"></div>
    </div>
    <div class="card" id="rescard" hidden><h2>Result</h2><div class="result" id="result"></div><div class="meta" id="rmeta"></div></div>
    <div class="card"><h2>Log</h2><div class="log" id="log"></div></div>
  </aside>
</main>
<script>
const $ = (id) => document.getElementById(id);
const EX = [
  ["Wikipedia: Eiffel Tower year", "Find the year the Eiffel Tower was completed, using Wikipedia's search box.", "https://en.wikipedia.org/wiki/Main_Page"],
  ["Hacker News: top story", "Tell me the title of the current top story and how many points it has.", "https://news.ycombinator.com/"],
  ["GitHub: ultralytics stars", "Search GitHub for the ultralytics repository and tell me its star count.", "https://github.com/"],
];
EX.forEach(([label, t, u]) => { const b = document.createElement("button"); b.textContent = label;
  b.onclick = () => { $("task").value = t; $("start").value = u; }; $("examples").appendChild(b); });

let st = {}, override = null, pendingKey = null;
const SW = 1280, SH = 800;

function placeMarker(pt, corrected) {
  const m = $("marker");
  if (!pt) { m.style.display = "none"; return; }
  const r = $("img").getBoundingClientRect();
  m.style.left = (pt[0] / SW * r.width) + "px";
  m.style.top = (pt[1] / SH * r.height) + "px";
  m.style.display = "block";
  m.classList.toggle("corrected", !!corrected);
}

function describe(a) {
  switch (a.action) {
    case "click": return `Click ${a.target}`;
    case "type": return `Type "${a.text}" into ${a.target}${a.submit ? " and press Enter" : ""}`;
    case "key": return `Press ${a.keys}`;
    case "scroll": return `Scroll ${a.direction || "down"} ×${a.amount || 5}`;
    case "navigate": return `Go to ${a.url}`;
    case "wait": return "Wait for the page";
    case "ask_user": return `Question: ${a.question}`;
    default: return JSON.stringify(a);
  }
}

async function poll() {
  try {
    st = await (await fetch("/state")).json();
    $("status").textContent = (st.status || "idle").replace("_", " ");
    $("status").className = "pill " + (st.status || "");
    $("elapsed").textContent = st.elapsed_s ? `${st.elapsed_s}s · ${st.usage.calls} planner calls` : "";
    $("log").textContent = (st.events || []).join("\n");
    $("log").scrollTop = 1e9;
    document.querySelectorAll("#modes button").forEach(b => b.classList.toggle("sel", b.dataset.m === (st.mode || "manual")));
    const p = st.pending;
    $("propcard").hidden = !p;
    if (p) {
      const key = st.id + ":" + p.n;
      if (key !== pendingKey) { pendingKey = key; override = null; $("pnote").value = "";
        $("ptext").hidden = p.action.action !== "type"; $("ptext").value = p.action.text || "";
        $("pnote").placeholder = p.action.action === "ask_user" ? "Your answer" : "Note to the agent (optional; required to reject)"; }
      $("pn").textContent = "#" + p.n;
      $("pact").innerHTML = "";
      $("pact").append(describe(p.action));
      if (p.action.risk === "high") { const s = document.createElement("span"); s.className = "risk"; s.textContent = "high risk"; $("pact").append(s); }
      $("pwhy").textContent = p.action.reason || "";
      $("pcount").textContent = p.auto_in != null ? `Auto-approving in ${p.auto_in}s (Stop or take control to intervene)` : "";
      $("phold").textContent = (st.mode !== "manual" && p.hold) ? `Waiting for you: ${p.hold}` : "";
      if (p.ground && p.ground.repeat_of_dead_spot) { const s = document.createElement("span"); s.className = "risk";
        s.textContent = "clicked here before with no effect"; $("pact").append(s); }
      const g = p.ground;
      $("pmeta").textContent = `plan ${p.plan_ms} ms` + (g ? ` · ground ${g.rtt_ms} ms (GPU ${g.gpu_ms} ms on ${g.gpu}${g.cold ? ", cold" : ""})` : "")
        + (p.point ? ` · point ${p.point}` : "");
      $("screen").classList.toggle("picking", !!p.point);
      placeMarker(override || p.point, !!override);
    } else { placeMarker(null); $("screen").classList.remove("picking"); }
    const fin = ["done", "stopped", "error"].includes(st.status);
    $("rescard").hidden = !fin;
    if (fin) { $("result").textContent = st.result || "";
      $("rmeta").textContent = `${st.steps.length} steps · ${st.elapsed_s}s · ${st.usage.prompt + st.usage.completion} tokens`; }
    $("run").disabled = !!st.status && !fin && st.status !== "idle";
    $("hstop").hidden = fin || !st.status || st.status === "idle";
    $("fuwrap").hidden = !fin;
  } catch (e) {}
}

function refreshImg() {
  // One long-lived MJPEG stream; reconnect if it drops.
  const el = $("img");
  el.onerror = () => setTimeout(refreshImg, 1000);
  el.src = "/stream?t=" + Date.now();
}

function refreshImgPoll() {
  const img = new Image();
  img.onload = () => { $("img").src = img.src; setTimeout(refreshImg, 250); };
  img.onerror = () => setTimeout(refreshImg, 1000);
  img.src = "/screen.jpg?t=" + Date.now();
}

// ---- manual control ----------------------------------------------------
let control = false;
const toXY = (e) => { const r = $("img").getBoundingClientRect();
  return [Math.round((e.clientX - r.left) / r.width * SW), Math.round((e.clientY - r.top) / r.height * SH)]; };
async function manual(body) {
  const r = await (await fetch("/manual", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body) })).json();
  if (!r.ok) { $("ctlhint").textContent = r.error; setTimeout(() => $("ctlhint").textContent =
    "You have control: click, scroll, type, paste. ⌘ acts as Ctrl.", 2500); }
}
$("ctl").onclick = () => { control = !control; $("ctl").classList.toggle("on", control);
  $("ctl").textContent = control ? "Release control" : "Take control"; $("screen").classList.toggle("control", control);
  if (control) document.activeElement.blur(); };
const KEYMAP = { Enter: "Return", Backspace: "BackSpace", Tab: "Tab", Escape: "Escape", Delete: "Delete",
  ArrowLeft: "Left", ArrowRight: "Right", ArrowUp: "Up", ArrowDown: "Down", Home: "Home", End: "End",
  PageUp: "Prior", PageDown: "Next", " ": "space" };
document.addEventListener("keydown", (e) => {
  if (!control || ["INPUT", "TEXTAREA"].includes(document.activeElement.tagName)) return;
  if (e.key === "Escape" && e.shiftKey) { $("ctl").click(); return; }      // shift+Esc releases control
  const mods = []; if (e.ctrlKey || e.metaKey) mods.push("ctrl"); if (e.altKey) mods.push("alt");
  if (["Control", "Meta", "Alt", "Shift"].includes(e.key)) return;
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "v") return;     // handled by paste
  e.preventDefault(); e.stopImmediatePropagation();
  if (!mods.length && e.key.length === 1) return manual({ action: "type", text: e.key });
  let k = KEYMAP[e.key] || (e.key.length === 1 ? e.key.toLowerCase() : e.key);
  if (e.shiftKey && mods.length) mods.push("shift");
  manual({ action: "key", keys: [...mods, k].join("+") });
}, true);
document.addEventListener("paste", (e) => {
  if (!control) return; const t = e.clipboardData.getData("text"); if (!t) return;
  e.preventDefault(); manual({ action: "type", text: t });
});
let wheelAcc = 0, wheelT = null;
$("img").addEventListener("wheel", (e) => {
  if (!control) return; e.preventDefault(); wheelAcc += e.deltaY; const [x, y] = toXY(e);
  clearTimeout(wheelT); wheelT = setTimeout(() => { const dy = Math.max(-10, Math.min(10, Math.round(wheelAcc / 60)));
    wheelAcc = 0; if (dy) manual({ action: "scroll", dy, x, y }); }, 120);
}, { passive: false });

$("img").addEventListener("click", (e) => {
  if (control) { const [x, y] = toXY(e); manual({ action: "click", x, y, count: e.detail >= 2 ? 1 : 1 }); return; }
  if (!st.pending || !st.pending.point) return;
  const r = e.target.getBoundingClientRect();
  override = [Math.round((e.clientX - r.left) / r.width * SW), Math.round((e.clientY - r.top) / r.height * SH)];
  placeMarker(override, true);
});

async function decide(kind) {
  const body = { kind, note: $("pnote").value || null };
  if (override) body.point = override;
  if (st.pending && st.pending.action.action === "type") body.text = $("ptext").value;
  if (kind === "reject" && !body.note) { $("pnote").focus(); $("pnote").placeholder = "Say why, so the agent can adjust"; return; }
  await fetch("/decide", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  override = null; poll();
}
$("approve").onclick = () => decide("approve");
$("reject").onclick = () => decide("reject");
const stopTask = () => fetch("/stop", { method: "POST" }).then(poll);
$("stop").onclick = stopTask;
$("hstop").onclick = stopTask;
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !$("hstop").hidden) { e.preventDefault(); stopTask(); return; }
  if (e.key === "Enter" && st.pending && document.activeElement.tagName !== "TEXTAREA") { e.preventDefault(); decide("approve"); }
});
$("run").onclick = async () => {
  const t = $("task").value.trim(); if (!t) return;
  const r = await (await fetch("/task", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ task: t, start_url: $("start").value.trim() || null,
                           follow_up: !$("fuwrap").hidden && $("followup").checked }) })).json();
  if (!r.ok) alert(r.error);
};
document.querySelectorAll("#modes button").forEach(b => b.onclick = async () => {
  await fetch("/mode", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ mode: b.dataset.m }) });
  poll(); });
window.addEventListener("resize", poll);
setInterval(poll, 400); poll(); refreshImg();
</script>
</body>
</html>
